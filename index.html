<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="課務行事曆">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E8%AA%B2%3C/text%3E%3C/svg%3E">
<title>課務行事曆管理</title>
<style>
  :root{
    --ink:#292524; --muted:#78716c; --faint:#a8a29e;
    --bg:#f5f5f4; --card:#ffffff; --border:#e7e5e4; --border2:#d6d3d1;
    --teal:#0f766e; --teal-dark:#0c5c56; --teal-bg:#ccfbf1; --teal-bg2:#f0fdfa;
    --amber:#b45309; --amber-bg:#fffbeb; --amber-bg2:#fef3c7;
    --sky:#0369a1; --sky-bg:#f0f9ff;
    --rose:#be123c; --rose-bg:#fff1f2; --rose-bg2:#ffe4e6;
    --emerald:#059669; --emerald-fill:#10b981;
    --violet:#6d28d9;
    --orange:#c2410c;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); }
  body{
    font-family: ui-rounded, "PingFang TC", "Heiti TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size:16px; line-height:1.5;
    -webkit-text-size-adjust:100%;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap{ max-width:480px; margin:0 auto; padding:16px 14px 40px; width:100%; }
  h1{ font-size:24px; font-weight:800; margin:0; }
  .header{ margin-bottom:16px; }

  .tabbar{ display:flex; gap:6px; margin-bottom:18px; }
  .tabbtn{ flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:11px 6px; border-radius:14px; border:2px solid var(--border); background:#fff; color:var(--muted); font-weight:700; font-size:14px; font-family:inherit; cursor:pointer; }
  .tabbtn.active{ background:var(--teal); color:#fff; border-color:var(--teal); }

  .card{ background:var(--card); border:2px solid var(--border); border-radius:18px; margin-bottom:18px; overflow:hidden; }
  .card.no-pad{ padding:0; }
  .p-3{ padding:12px; }
  .p-4{ padding:16px; }

  .collapse-header{ width:100%; display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:none; border:none; font-family:inherit; cursor:pointer; }
  .bold{ font-size:16px; font-weight:800; color:var(--ink); }
  .collapse-body{ padding:0 16px 16px; }

  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:13px; color:var(--muted); margin-bottom:5px; }
  label.label{ display:block; font-size:13px; color:var(--muted); margin-bottom:5px; }
  .input,.select,.textarea{
    width:100%; border:2px solid var(--border); border-radius:12px; padding:10px 12px;
    font-size:16px; font-family:inherit; background:#fff; color:var(--ink);
  }
  .textarea{ resize:none; }
  .hint{ font-size:13px; color:var(--faint); }
  .mt-3{ margin-top:12px; } .mt-4{ margin-top:16px; } .mb-2{ margin-bottom:8px; } .mb-3{ margin-bottom:12px; } .mb-4{ margin-bottom:16px; } .mb-5{ margin-bottom:20px; }
  .muted{ font-size:14px; color:var(--faint); }

  .tabrow{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .chip{ padding:8px 13px; border-radius:12px; border:2px solid var(--border); background:#fafaf9; color:var(--muted); font-weight:700; font-size:14px; font-family:inherit; cursor:pointer; }
  .chip-active{ background:var(--teal); color:#fff; border-color:var(--teal); }

  .slotlist{ display:flex; flex-direction:column; }
  .slotlist.px-3{ padding:0 12px; }
  .slotrow{ display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid #f2f1ef; }
  .slotrow:last-child{ border-bottom:none; }
  .slotlabel{ width:34px; flex-shrink:0; text-align:center; font-weight:800; color:var(--teal); font-size:16px; }
  .cellcontent{ flex:1; min-width:0; font-size:16px; border-radius:10px; padding:7px 11px; word-break:break-word; }
  .cell-empty{ color:#d6d3d1; }
  .cell-class{ color:#44403c; }
  .cell-change{ background:var(--amber-bg2); color:#92400e; font-weight:700; }
  .cell-holiday{ background:var(--rose-bg2); color:var(--rose); font-weight:800; }
  .cell-holiday-empty{ background:var(--rose-bg); color:#fecdd3; }

  .cls-empty{ color:#d6d3d1; }
  .cls-other{ background:#efefed; color:#7a7873; }

  .overview-grid{ display:grid; grid-template-columns: 28px repeat(5,1fr); gap:4px; align-items:center; }
  .ov-head{ text-align:center; font-size:11px; font-weight:700; color:var(--faint); }
  .ov-slot{ text-align:center; font-size:11px; font-weight:800; color:var(--teal); padding:5px 0; }
  .ov-cell{ text-align:center; font-size:12px; padding:5px 0; border-radius:8px; color:#d6d3d1; }
  .ov-filled{ background:var(--teal-bg); color:var(--teal-dark); font-weight:700; }

  .empty-box{ font-size:14px; color:var(--faint); background:#fff; border:2px dashed var(--border2); border-radius:18px; padding:34px 20px; text-align:center; }

  .weeknav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px; }
  .navbtn{ display:flex; align-items:center; gap:4px; padding:9px 12px; border-radius:12px; border:2px solid #99f6e4; background:#fff; color:var(--teal); font-weight:700; font-size:14px; font-family:inherit; cursor:pointer; white-space:nowrap; }
  .navbtn.disabled{ color:#d6d3d1; border-color:var(--border); background:#fafaf9; }
  .weektitle{ text-align:center; }
  .weeknum{ font-size:20px; font-weight:800; }
  .weekrange{ font-size:12px; color:var(--faint); }

  .reminder-box{ margin-bottom:12px; background:var(--teal-bg2); border:2px solid #99f6e4; color:#0f5c56; font-weight:700; font-size:14px; border-radius:14px; padding:10px 13px; word-break:break-word; }

  .dayblock{ border-bottom:1px solid #f2f1ef; }
  .dayblock:last-child{ border-bottom:none; }
  .daytitle{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:#fafaf9; font-weight:800; font-size:16px; }
  .daytitle.holiday{ background:var(--rose-bg); color:var(--rose); }

  .weekgrid{ display:grid; grid-template-columns: 24px repeat(5,1fr); gap:3px; }
  .wg-cell{ font-size:11px; text-align:center; padding:5px 2px; border-radius:7px; word-break:break-word; line-height:1.25; }
  .wg-head{ font-weight:800; color:#57534e; background:#fafaf9; padding:7px 2px; }
  .wg-date{ font-size:9px; font-weight:400; color:#a8a29e; }
  .wg-holiday-head{ background:var(--rose-bg); color:var(--rose); }
  .wg-outrange-head{ opacity:0.45; }
  .wg-slot{ font-weight:800; color:var(--teal); background:#f0fdfa; display:flex; align-items:center; justify-content:center; }
  .wg-content{ border:1px solid #f2f1ef; min-height:32px; display:flex; align-items:center; justify-content:center; }
  .daydate{ font-size:12px; font-weight:400; color:var(--faint); }

  .notes-box{ background:var(--amber-bg); border:2px solid #fde68a; border-radius:18px; padding:13px; margin-bottom:16px; }
  .notes-title{ font-size:14px; font-weight:800; color:var(--amber); margin-bottom:8px; }

  .legend{ display:flex; flex-wrap:wrap; gap:12px; font-size:13px; color:var(--muted); margin-bottom:16px; }
  .legend span{ display:flex; align-items:center; gap:6px; }
  .dot{ width:14px; height:14px; border-radius:4px; display:inline-block; }
  .dot-change{ background:var(--amber-bg2); border:1px solid #fde68a; }
  .dot-holiday{ background:var(--rose-bg2); border:1px solid #fecdd3; }

  .checklist-header{ display:grid; grid-template-columns: 2fr; gap:4px; padding:0 2px 8px; }
  .checklist-body .checklist-row{ display:grid; grid-template-columns: 2fr; gap:4px; align-items:flex-start; padding:7px 2px; border-bottom:1px solid #f2f1ef; }
  .checklist-body .checklist-row:last-child{ border-bottom:none; }
  .ck-head{ text-align:center; font-size:12px; font-weight:800; color:var(--faint); }
  .ck-itemname{ font-size:14px; font-weight:700; color:#44403c; word-break:break-word; line-height:1.3; text-align:left; }
  .ck-done{ font-size:11px; color:var(--emerald); margin-top:2px; }
  .ck-cell{ aspect-ratio:1/1; width:100%; border-radius:11px; border:2px solid; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; font-family:inherit; cursor:pointer; padding:0; overflow:hidden; white-space:nowrap; line-height:1; }
  .ck-empty{ background:#fafaf9; border-color:var(--border2); border-style:dashed; color:#d6d3d1; }
  .ck-detail{ background:#ececea; border-color:var(--border2); color:#57534e; }
  .ck-colored{ border-width:2px; font-weight:800; }

  .btn{ border:none; border-radius:13px; padding:12px 16px; font-weight:800; font-size:16px; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .btn-teal{ background:var(--teal); color:#fff; }
  .btn-sky{ background:var(--sky); color:#fff; }
  .btn-amber{ background:var(--amber); color:#fff; }
  .btn-violet{ background:var(--violet); color:#fff; }
  .btn-orange{ background:var(--orange); color:#fff; }
  .btn-rose{ background:var(--rose); color:#fff; }
  .btn-dark{ background:#44403c; color:#fff; }
  .btn-green{ background:var(--emerald); color:#fff; }
  .btn-light{ background:#f5f5f4; color:#57534e; }
  .btn-text{ background:none; color:var(--faint); padding:12px 8px; }
  .btn-block{ width:100%; }
  .btn-sm{ padding:9px 13px; font-size:14px; border-radius:11px; }

  .stack{ display:flex; flex-direction:column; gap:16px; }
  .stack-sm{ display:flex; flex-direction:column; gap:10px; }
  .swapbox{ border:2px solid #f2f1ef; border-radius:14px; padding:12px; }
  .swapbox-title{ font-size:13px; font-weight:800; color:var(--muted); margin-bottom:8px; }
  .section-title{ font-size:16px; font-weight:800; margin:0 0 12px; display:flex; align-items:center; gap:7px; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(41,37,36,0.45); display:flex; align-items:center; justify-content:center; z-index:9999; padding:16px; }
  .modal{ background:#fff; border-radius:18px; padding:20px; width:100%; max-width:360px; }
  .modal-title{ font-size:18px; font-weight:800; margin-bottom:12px; }
  .modal-actions{ display:flex; flex-wrap:wrap; gap:8px; }

  #toast{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(20px); background:#292524; color:#fff; font-size:14px; padding:11px 18px; border-radius:13px; box-shadow:0 8px 24px rgba(0,0,0,0.2); z-index:10000; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:90%; text-align:center; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .rose-card{ border-color:#fecdd3; }
  .rose-title{ color:var(--rose); }

  /* 課表範本選項列 */
  .tplopt-row{ display:flex; align-items:center; gap:8px; }
  .tplopt-row .tplopt-name{ flex:1; }
  .tplopt-check{ display:flex; align-items:center; gap:4px; font-size:13px; color:var(--muted); white-space:nowrap; }
  .tplopt-remove{ flex-shrink:0; }

  /* 自訂日期欄位 / 日期選擇器 */
  .datefield{ display:flex; align-items:center; justify-content:space-between; cursor:pointer; text-align:left; }
  .datefield-empty{ color:var(--faint); }
  .datefield-icon{ font-size:14px; margin-left:8px; }

  .datepicker-modal{ max-width:320px; }
  .dp-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .dp-navbtn{ border:none; background:#f5f5f4; border-radius:10px; width:32px; height:32px; font-size:18px; cursor:pointer; color:var(--teal); font-family:inherit; }
  .dp-monthlabel{ font-weight:800; font-size:15px; }
  .dp-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:12px; color:var(--faint); margin-bottom:4px; }
  .dp-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .dp-cell{ aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:14px; border:none; background:none; border-radius:10px; cursor:pointer; font-family:inherit; color:var(--ink); padding:0; }
  .dp-empty{ cursor:default; }
  .dp-today{ font-weight:800; color:var(--teal); }
  .dp-selected{ background:var(--teal); color:#fff; font-weight:800; }

  /* 列印 / 輸出PDF */
  #print-area{ display:none; }
  .ptable{ width:100%; border-collapse:collapse; margin:8px 0 16px; font-size:12px; }
  .ptable th,.ptable td{ border:1px solid #ccc; padding:4px 6px; text-align:center; }
  @media print{
    body > .wrap, #toast{ display:none !important; }
    #print-area{ display:block !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1 id="app-title">課務行事曆管理</h1>
    </div>
    <div id="root"></div>
  </div>
  <div id="toast"></div>
  <div id="print-area"></div>

<script>
(function(){
  "use strict";

  var WEEKDAY_LABELS = ["週一", "週二", "週三", "週四", "週五"];
  var SLOTS = ["M", "1", "2", "3", "4", "N", "5", "6", "7", "E"];
  var STORAGE_KEY = "school-schedule-state-v1";
  var COLOR_PALETTE = [
    {bg:'#f5dde1', fg:'#a23b52'},
    {bg:'#f6e3d0', fg:'#a3661f'},
    {bg:'#f3edc9', fg:'#8c7818'},
    {bg:'#dfeade', fg:'#4a7a52'},
    {bg:'#dbe6ef', fg:'#3f6690'},
    {bg:'#e6dfef', fg:'#6a5490'},
    {bg:'#f0dde9', fg:'#964d80'},
    {bg:'#e8e6bd', fg:'#6f6f1f'},
    {bg:'#ecd9c9', fg:'#8f4a26'},
    {bg:'#dde1e6', fg:'#4a5b68'}
  ];

  var idCounter = 0;
  function genId(){ idCounter += 1; return "id" + idCounter + "_" + Math.random().toString(36).slice(2,8); }

  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function formatDate(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function shortDate(s){ return s ? s.slice(5).replace("-","/") : ""; }
  function parseDate(s){ var parts = s.split("-").map(Number); return new Date(parts[0], parts[1]-1, parts[2]); }
  function addDays(d, n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function mondayOf(dateStr){
    var d = parseDate(dateStr); var day = d.getDay();
    var diff = day === 0 ? -6 : 1-day;
    return formatDate(addDays(d, diff));
  }
  function weekdayIdxMonFri(dateStr){
    var day = parseDate(dateStr).getDay();
    return (day >= 1 && day <= 5) ? day-1 : -1;
  }
  function buildWeeks(startStr, endStr){
    if(!startStr || !endStr) return [];
    var start = parseDate(startStr), end = parseDate(endStr);
    if(start > end) return [];
    var cur = parseDate(mondayOf(startStr));
    var weeks = []; var idx = 1; var guard = 0;
    while(cur <= end && guard < 400){
      guard++;
      var days = [];
      var hasInRange = false;
      for(var i=0;i<5;i++){
        var d = addDays(cur, i);
        var inRange = (d >= start && d <= end);
        if(inRange) hasInRange = true;
        days.push({ date:d, dateStr:formatDate(d), weekdayIdx:i, inRange:inRange });
      }
      if(hasInRange){ weeks.push({ weekIndex: idx, mondayStr: formatDate(cur), days: days }); idx++; }
      cur = addDays(cur, 7);
    }
    return weeks;
  }
  function emptyTemplate(){
    var t = {};
    for(var i=0;i<5;i++){ t[i]={}; SLOTS.forEach(function(s){ t[i][s]=""; }); }
    return t;
  }
  function emptyClasses(targets){
    var c = {};
    (targets||[]).forEach(function(t){ c[t] = { status:"empty", date:"", text:"" }; });
    return c;
  }
  function escapeHtml(str){
    if(str === undefined || str === null) return "";
    return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function monthMatrix(ym){
    var parts = ym.split('-').map(Number);
    var year = parts[0], month = parts[1]-1;
    var first = new Date(year, month, 1);
    var startOffset = (first.getDay()+6)%7;
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var cells = [];
    for(var i=0;i<startOffset;i++){ cells.push(null); }
    for(var d=1; d<=daysInMonth; d++){ cells.push(d); }
    return cells;
  }

  var state = {
    tab: "calendar",
    myTitle: "",
    termStart: "", termEnd: "",
    template: emptyTemplate(),
    templateOptions: [],
    overrides: {}, holidayNames: {}, reminders: {}, keyNotes: {},
    checklist: [],
    templateActiveDay: 0,
    currentWeekIndex: 0,
    editingCell: null,
    editDate: "",
    editItemId: "",
    datePicker: null,
    remDate:"",
    swapADate:"", swapASlot:"",
    swapBDate:"", swapBSlot:"",
    chgDate:"", chgSlot:"",
    holDate:"",
    endSemOpen: false,
    endsemDate: "",
    endsemPdf: "",
    sectionOpen: { setup:true, reminder:false, swap:false, change:false, holiday:false, backup:false, endsem:false }
  };

  function templateOptionNames(){
    return state.templateOptions.map(function(o){ return o.name; }).filter(function(n){ return n; });
  }
  function checkTargets(){
    return state.templateOptions.filter(function(o){ return o.isTarget && o.name; }).map(function(o){ return o.name; });
  }
  function optionColor(name){
    var names = templateOptionNames();
    var idx = names.indexOf(name);
    if(idx === -1) return null;
    return COLOR_PALETTE[idx % COLOR_PALETTE.length];
  }

  function getEffective(dateStr, weekdayIdx, slot){
    var key = dateStr + "__" + slot;
    if(state.overrides[key] !== undefined) return state.overrides[key];
    var cls = state.template[weekdayIdx] ? state.template[weekdayIdx][slot] : "";
    return cls ? { content: cls, type: "class" } : { content: "", type: "empty" };
  }
  function cellStyleAttrs(cell){
    if(cell.type === "empty" || cell.type === "holiday-empty") return { cls:"cls-empty", style:"" };
    if(cell.type === "class"){
      var c = optionColor(cell.content);
      if(c) return { cls:"", style:"background:"+c.bg+";color:"+c.fg+";font-weight:700;" };
    }
    return { cls:"cls-other", style:"" };
  }
  function sortedChecklist(){
    return state.checklist.slice().sort(function(a,b){
      var ad = a.completedAt ? 1 : 0, bd = b.completedAt ? 1 : 0;
      if(ad !== bd) return ad - bd;
      if(ad) return a.completedAt - b.completedAt;
      return a.createdAt - b.createdAt;
    });
  }

  function saveToStorage(){
    var data = {
      myTitle: state.myTitle,
      termStart: state.termStart, termEnd: state.termEnd, template: state.template,
      templateOptions: state.templateOptions,
      overrides: state.overrides, holidayNames: state.holidayNames, reminders: state.reminders,
      keyNotes: state.keyNotes, checklist: state.checklist
    };
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  }
  function loadFromStorage(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var data = JSON.parse(raw);
        if(data.myTitle) state.myTitle = data.myTitle;
        if(data.termStart) state.termStart = data.termStart;
        if(data.termEnd) state.termEnd = data.termEnd;
        if(data.template) state.template = data.template;
        if(data.templateOptions) state.templateOptions = data.templateOptions;
        if(data.overrides) state.overrides = data.overrides;
        if(data.holidayNames) state.holidayNames = data.holidayNames;
        if(data.reminders) state.reminders = data.reminders;
        if(data.keyNotes) state.keyNotes = data.keyNotes;
        if(data.checklist) state.checklist = data.checklist;
        return true;
      }
    }catch(e){}
    return false;
  }

  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2500);
  }

  function selectHtml(field, options, current){
    var opts = options.map(function(o){
      return '<option value="'+escapeHtml(o.value)+'" '+(current===o.value?'selected':'')+'>'+escapeHtml(o.label)+'</option>';
    }).join('');
    return '<select class="select" data-action="set-field" data-field="'+field+'"><option value="">請選擇</option>'+opts+'</select>';
  }

  function validateSchoolDate(dateStr){
    if(!dateStr) return { ok:true };
    if(state.termStart && dateStr < state.termStart) return { ok:false, msg:"日期需在學期範圍內（"+state.termStart+" ～ "+state.termEnd+"）" };
    if(state.termEnd && dateStr > state.termEnd) return { ok:false, msg:"日期需在學期範圍內（"+state.termStart+" ～ "+state.termEnd+"）" };
    if(weekdayIdxMonFri(dateStr) === -1) return { ok:false, msg:"請選擇週一至週五" };
    return { ok:true };
  }
  function dateInputHtml(field, value, extraClass, mode){
    mode = mode || 'validated';
    var display = value ? value : '請選擇日期';
    return '<button type="button" class="input datefield '+(extraClass||'')+' '+(value?'':'datefield-empty')+'" data-action="open-datepicker" data-field="'+field+'" data-mode="'+mode+'">'+
      '<span>'+escapeHtml(display)+'</span><span class="datefield-icon">\uD83D\uDCC5</span></button>';
  }
  function moduleCard(icon, title, key, bodyHtml, extraClass, titleClass){
    var open = !!state.sectionOpen[key];
    return '<div class="card '+(extraClass||'')+'">' +
      '<button class="collapse-header" data-action="toggle-section" data-key="'+key+'"><span class="bold '+(titleClass||'')+'">'+icon+' '+title+'</span><span>'+(open?'▾':'▸')+'</span></button>' +
      (open ? ('<div class="collapse-body">'+bodyHtml+'</div>') : '') +
      '</div>';
  }

  function renderApp(){
    var body = '<div class="tabbar">'+
      ['calendar','checklist','changes'].map(function(id){
        var label = id==='calendar' ? '📅 行事曆' : (id==='checklist' ? '✅ 進度' : '✏️ 輸入・異動');
        return '<button class="tabbtn '+(state.tab===id?'active':'')+'" data-action="set-tab" data-tab="'+id+'">'+label+'</button>';
      }).join('') +
      '</div>';
    if(state.tab === 'calendar') body += renderCalendarTab();
    else if(state.tab === 'checklist') body += renderChecklistTab();
    else body += renderChangesTab();
    return body;
  }

  function renderCalendarTab(){
    var weeks = buildWeeks(state.termStart, state.termEnd);
    var html = '';
    if(weeks.length === 0){
      html += '<div class="empty-box">尚未設定學期起訖日期，請先於「輸入・異動」分頁展開「學期設定與課表範本」。</div>';
      return html;
    }

    var weekIdxSafe = Math.min(state.currentWeekIndex, weeks.length-1);
    var week = weeks[weekIdxSafe];
    var firstDate = week.days[0].dateStr;
    var lastDate = week.days[week.days.length-1].dateStr;

    html += '<div class="weeknav">' +
      '<button class="navbtn '+(weekIdxSafe===0?'disabled':'')+'" data-action="prev-week" '+(weekIdxSafe===0?'disabled':'')+'>◀ 上一週</button>' +
      '<div class="weektitle"><div class="weeknum">Week '+week.weekIndex+'</div><div class="weekrange">'+firstDate+' ～ '+lastDate+'</div></div>' +
      '<button class="navbtn '+(weekIdxSafe===weeks.length-1?'disabled':'')+'" data-action="next-week" '+(weekIdxSafe===weeks.length-1?'disabled':'')+'>下一週 ▶</button>' +
      '</div>';

    if(state.reminders[week.mondayStr]){
      html += '<div class="reminder-box">⭐'+escapeHtml(state.reminders[week.mondayStr])+'</div>';
    }

    html += '<div class="card p-3 mb-4"><div class="weekgrid">';
    html += '<div class="wg-cell wg-head"></div>';
    week.days.forEach(function(d){
      var isHoliday = !!state.holidayNames[d.dateStr];
      html += '<div class="wg-cell wg-head '+(isHoliday?'wg-holiday-head':'')+(d.inRange?'':' wg-outrange-head')+'">'+WEEKDAY_LABELS[d.weekdayIdx]+'<br><span class="wg-date">'+d.dateStr.slice(5)+'</span></div>';
    });
    SLOTS.forEach(function(slot){
      html += '<div class="wg-cell wg-slot">'+slot+'</div>';
      week.days.forEach(function(d){
        if(!d.inRange){
          html += '<div class="wg-cell wg-content cls-empty">-</div>';
          return;
        }
        var cell = getEffective(d.dateStr, d.weekdayIdx, slot);
        var sa = cellStyleAttrs(cell);
        html += '<div class="wg-cell wg-content '+sa.cls+'" style="'+sa.style+'">'+(escapeHtml(cell.content) || '—')+'</div>';
      });
    });
    html += '</div></div>';

    html += '<div class="notes-box"><div class="notes-title">重點紀錄</div>' +
      '<textarea class="textarea" rows="4" placeholder="本週重點..." data-action="save-keynotes" data-week="'+week.mondayStr+'">'+escapeHtml(state.keyNotes[week.mondayStr]||'')+'</textarea></div>';

    var names = templateOptionNames();
    if(names.length){
      html += '<div class="legend">' +
        names.map(function(n){
          var c = optionColor(n);
          return '<span><span class="dot" style="background:'+(c?c.bg:'#efefed')+';border:1px solid '+(c?c.fg:'#ccc')+'"></span>'+escapeHtml(n)+'</span>';
        }).join('') +
        '<span><span class="dot cls-other"></span>其他</span>' +
        '</div>';
    }

    return html;
  }

  function renderChecklistTab(){
    var html = '';
    var targets = checkTargets();
    if(targets.length === 0){
      html += '<div class="empty-box mb-4">尚未設定「進度」標的，請先在「輸入・異動」分頁的「學期設定與課表範本」中，勾選課表範本選項作為標的。</div>';
    } else if(state.checklist.length === 0){
      html += '<div class="empty-box mb-4">尚無進度項目，請在下方新增第一個項目。</div>';
    } else {
      var sorted = sortedChecklist();
      var gridStyle = 'grid-template-columns: 2fr repeat('+targets.length+',1fr);';
      html += '<div class="card p-4 mb-4">';
      html += '<div class="checklist-header" style="'+gridStyle+'"><div></div>' + targets.map(function(t){ return '<div class="ck-head">'+escapeHtml(t)+'</div>'; }).join('') + '</div>';
      html += '<div class="checklist-body">';
      sorted.forEach(function(item){
        html += '<div class="checklist-row" style="'+gridStyle+'"><div><div class="ck-itemname">'+escapeHtml(item.name)+'</div>'+(item.completedAt?'<div class="ck-done">已完成</div>':'')+'</div>';
        targets.forEach(function(t){
          var cell = item.classes[t] || { status:'empty', date:'', text:'' };
          var cellCls = 'ck-cell'; var content = ''; var style = '';
          if(cell.status === 'colored'){
            cellCls += ' ck-colored'; content = '✓';
            var c = optionColor(t);
            if(c) style = 'background:'+c.bg+';color:'+c.fg+';border-color:'+c.fg+';';
          }
          else if(cell.status === 'detail'){ cellCls += ' ck-detail'; content = shortDate(cell.date); }
          else { cellCls += ' ck-empty'; content = '+'; }
          html += '<button class="'+cellCls+'" style="'+style+'" data-action="open-editor" data-item="'+item.id+'" data-cls="'+escapeHtml(t)+'">'+content+'</button>';
        });
        html += '</div>';
      });
      html += '</div></div>';
    }

    html += '<div class="card p-4 mb-4"><h3 class="section-title">📋 課程內容</h3><div class="stack-sm">' +
      '<input class="input" id="f-course-name" placeholder="輸入項目名稱，如：第三課習作">' +
      '<button class="btn btn-teal" data-action="add-course">➕ 新增至進度</button>' +
      '</div></div>';

    var editItem = state.editItemId ? state.checklist.filter(function(i){ return i.id===state.editItemId; })[0] : null;
    html += '<div class="card p-4"><h3 class="section-title">✏️ 內容修改</h3><div class="stack-sm">' +
      selectHtml('editItemId', state.checklist.map(function(i){ return { value:i.id, label:i.name }; }), state.editItemId) +
      (editItem ? '<input class="input" id="f-edit-item-name" value="'+escapeHtml(editItem.name)+'" placeholder="修改項目名稱">' : '') +
      (editItem ? '<button class="btn btn-dark" data-action="save-item-edit">儲存修改</button>' : '') +
      '</div></div>';

    return html;
  }

  function renderEditorModal(){
    var item = state.checklist.filter(function(i){ return i.id === state.editingCell.itemId; })[0];
    if(!item) return '';
    var cls = state.editingCell.cls;
    var cell = item.classes[cls] || { status:'empty', date:'', text:'' };
    return '<div class="modal-overlay">' +
      '<div class="modal">' +
        '<div class="modal-title">'+escapeHtml(item.name)+' · '+escapeHtml(cls)+'</div>' +
        '<label class="label">日期</label>' +
        '<div class="mb-3">'+dateInputHtml('editDate', state.editDate, '', 'validated')+'</div>' +
        '<label class="label">細節內容（選填）</label>' +
        '<textarea class="textarea mb-4" id="editor-text" rows="3">'+escapeHtml(cell.text||'')+'</textarea>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-dark btn-sm" data-action="save-cell" data-status="detail">儲存</button>' +
          '<button class="btn btn-green btn-sm" data-action="save-cell" data-status="colored">標記完成</button>' +
          '<button class="btn btn-light btn-sm" data-action="clear-cell">清除</button>' +
          '<button class="btn btn-text btn-sm" data-action="close-editor">取消</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function renderDatePickerModal(){
    var dp = state.datePicker;
    if(!dp) return '';
    var value = state[dp.field] || '';
    var parts = dp.viewYM.split('-').map(Number);
    var year = parts[0], monthIdx = parts[1]-1;
    var monthLabel = year + ' 年 ' + (monthIdx+1) + ' 月';
    var cells = monthMatrix(dp.viewYM);
    var todayStr = formatDate(new Date());
    var html = '<div class="modal-overlay dp-overlay">' +
      '<div class="modal datepicker-modal">' +
        '<div class="dp-header">' +
          '<button class="dp-navbtn" type="button" data-action="dp-prev-month">‹</button>' +
          '<div class="dp-monthlabel">'+monthLabel+'</div>' +
          '<button class="dp-navbtn" type="button" data-action="dp-next-month">›</button>' +
        '</div>' +
        '<div class="dp-weekdays">' + ['一','二','三','四','五','六','日'].map(function(w){ return '<div>'+w+'</div>'; }).join('') + '</div>' +
        '<div class="dp-grid">' + cells.map(function(day){
          if(day === null) return '<div class="dp-cell dp-empty"></div>';
          var dStr = year+'-'+pad(monthIdx+1)+'-'+pad(day);
          var isSelected = dStr === value;
          var isToday = dStr === todayStr;
          return '<button type="button" class="dp-cell dp-day '+(isSelected?'dp-selected':'')+' '+((isToday && !isSelected)?'dp-today':'')+'" data-action="dp-pick" data-date="'+dStr+'">'+day+'</button>';
        }).join('') + '</div>' +
        (value ? '<button class="btn btn-light btn-sm btn-block mt-3" type="button" data-action="dp-clear">清除日期</button>' : '') +
        '<button class="btn btn-text btn-sm btn-block" type="button" data-action="close-datepicker">關閉</button>' +
      '</div>' +
    '</div>';
    return html;
  }

    var html = '<div class="stack">';

    var chgCurrent = (state.chgDate && state.chgSlot) ? getEffective(state.chgDate, weekdayIdxMonFri(state.chgDate), state.chgSlot) : null;
    var chgBody = '<div class="stack-sm">' +
      '<div class="field"><label>日期</label>'+dateInputHtml('chgDate', state.chgDate)+'</div>' +
      '<div class="field"><label>時段</label>'+selectHtml('chgSlot', SLOTS.map(function(s){return {value:s,label:s};}), state.chgSlot)+'</div>' +
      ((state.chgDate && state.chgSlot) ? '<div class="muted">該時段目前內容：'+(escapeHtml(chgCurrent.content)||'（無）')+'</div>' : '') +
      '<div class="field"><label>異動內容（手動輸入以修改原內容，亦可用於加入活動）</label><input class="input" id="f-chg-content" placeholder="如：代課老師／改上自習／校外教學"></div>' +

    var swapBody = '<div class="stack-sm">' +
      '<div class="swapbox"><div class="swapbox-title">時段 A</div><div class="stack-sm">' +
        dateInputHtml('swapADate', state.swapADate) +
        selectHtml('swapASlot', SLOTS.map(function(s){return {value:s,label:s};}), state.swapASlot) +
        '</div>' + ((state.swapADate && state.swapASlot) ? '<div class="muted mt-2">目前內容：'+(escapeHtml(swapACurrent.content)||'（無）')+'</div>' : '') + '</div>' +
      '<div class="swapbox"><div class="swapbox-title">時段 B</div><div class="stack-sm">' +
        dateInputHtml('swapBDate', state.swapBDate) +
        selectHtml('swapBSlot', SLOTS.map(function(s){return {value:s,label:s};}), state.swapBSlot) +
        '</div>' + ((state.swapBDate && state.swapBSlot) ? '<div class="muted mt-2">目前內容：'+(escapeHtml(swapBCurrent.content)||'（無）')+'</div>' : '') + '</div>' +
      '<button class="btn btn-violet" data-action="swap-classes">交換內容</button>' +
      '</div>';
    html += moduleCard('🔀', '調課', 'swap', swapBody);

    var holBody = '<div class="stack-sm">' +
      '<div class="field"><label>日期</label>'+dateInputHtml('holDate', state.holDate)+'</div>' +
      '<div class="field"><label>假期名稱</label><input class="input" id="f-hol-name" placeholder="如：教師節"></div>' +
      '<button class="btn btn-rose" data-action="set-holiday">設定放假</button>' +
      '</div>';
    html += moduleCard('🏖️', '放假', 'holiday', holBody);

    var remBody = '<div class="stack-sm">' +
      '<div class="field"><label>日期（將顯示於該日期所屬週次）</label>'+dateInputHtml('remDate', state.remDate)+'</div>' +
      '<div class="field"><label>提醒內容</label><input class="input" id="f-rem-text" placeholder="如：週五交作業"></div>' +
      '<button class="btn btn-amber" data-action="add-reminder">加入提醒</button>' +
      '</div>';
    html += moduleCard('📌', '提醒事項', 'reminder', remBody);

    // 學期設定與課表範本（倒數第二個模塊，在學期結束上方）
    var weeks = buildWeeks(state.termStart, state.termEnd);
    var setupBody = '<div class="field"><label>我的標題（留空則使用預設標題「課務行事曆管理」）</label><input class="input" id="f-my-title" data-action="save-mytitle" value="'+escapeHtml(state.myTitle||'')+'" placeholder="留空則不更改標題"></div>' +
      '<div class="field"><label>本學期起始日期</label>'+dateInputHtml('termStart', state.termStart, '', 'plain')+'</div>' +
      '<div class="field"><label>本學期結束日期</label>'+dateInputHtml('termEnd', state.termEnd, '', 'plain')+'</div>' +
      '<div class="hint mb-3">'+(weeks.length>0 ? "已產生 "+weeks.length+" 週行事曆" : "請選擇起訖日期以產生行事曆")+'</div>';
    if(state.termStart && state.termEnd){
      setupBody += '<div class="hint mb-2">課表範本選項（輸入本學期課表所需的選項名稱，並勾選是否作為「進度」清單的標的）</div>';
      setupBody += '<div class="stack-sm mb-3">' + state.templateOptions.map(function(opt, idx){
        return '<div class="tplopt-row">' +
          '<input class="input tplopt-name" data-action="save-tplopt-name" data-idx="'+idx+'" value="'+escapeHtml(opt.name)+'" placeholder="如：601">' +
          '<label class="tplopt-check"><input type="checkbox" data-action="toggle-tplopt-target" data-idx="'+idx+'" '+(opt.isTarget?'checked':'')+'>標的</label>' +
          '<button class="btn-text btn-sm tplopt-remove" type="button" data-action="remove-tplopt" data-idx="'+idx+'">✕</button>' +

      if(curNames.length > 0){

        setupBody += '<div class="tabrow">'+ WEEKDAY_LABELS.map(function(w,i){
          return '<button class="chip '+(state.templateActiveDay===i?'chip-active':'')+'" data-action="set-template-day" data-day="'+i+'">'+w+'</button>';
        }).join('') + '</div>';
        setupBody += '<div class="slotlist">' + SLOTS.map(function(slot){
          var opts = curNames.map(function(c){
            return '<option value="'+escapeHtml(c)+'" '+(state.template[state.templateActiveDay][slot]===c?'selected':'')+'>'+escapeHtml(c)+'</option>';
          }).join('');
          return '<div class="slotrow"><div class="slotlabel">'+slot+'</div>'+
            '<select class="select" data-action="set-template-value" data-slot="'+slot+'"><option value="">未排課</option>'+opts+'</select></div>';

      setupBody += '<div class="hint">請先選擇起訖日期，再設定課表範本選項</div>';

      '<div class="hint mt-3">匯入：貼上先前匯出的內容，或直接選擇先前下載的備份檔案，將會覆蓋目前所有資料。</div>' +
      '<textarea class="textarea" id="backup-import-text" rows="4" placeholder="貼上先前匯出的備份內容"></textarea>' +
      '<input type="file" accept="application/json,.json" id="backup-import-file" class="input">' +
      '<button class="btn btn-rose" type="button" data-action="do-import">📥 匯入（將覆蓋目前資料）</button>' +
      '</div>';

      endBody = '<div class="stack-sm">' +
        '<p class="muted">此操作將清空所有行事曆、進度與異動紀錄，下次進入需重新輸入。請輸入學期結束日期以確認：</p>' +
        '<div class="field">'+dateInputHtml('endsemDate', state.endsemDate, '', 'plain')+'</div>' +
        '<div class="field"><label>是否輸出PDF（本學期行事曆與進度）</label>'+selectHtml('endsemPdf', [{value:'yes',label:'是'},{value:'no',label:'否'}], state.endsemPdf)+'</div>' +
        '<button class="btn btn-rose btn-block" data-action="confirm-endsem">確認結束並重置</button>' +
        '<button class="btn btn-light btn-block" data-action="cancel-endsem">取消</button>' +
        '</div>';
    }
    html += moduleCard('🔄', '學期結束', 'endsem', endBody, 'rose-card', 'rose-title');

    html += '</div>';
    return html;
  }

  function render(){
    document.getElementById('root').innerHTML = renderApp();
    updateAppTitle();
    var overlayHost = document.getElementById('modal-host');
    if(overlayHost) overlayHost.remove();
    if(state.editingCell || state.datePicker){
      var host = document.createElement('div');
      host.id = 'modal-host';
      var mhtml = '';
      if(state.editingCell) mhtml += renderEditorModal();
      if(state.datePicker) mhtml += renderDatePickerModal();
      host.innerHTML = mhtml;
      document.body.appendChild(host);
    }
  }

  // ---------- Actions ----------
  function addCourseItem(){
    var el = document.getElementById('f-course-name');
    var val = el ? el.value.trim() : '';
    if(!val){ toast('請輸入項目名稱'); return; }
    state.checklist.push({ id: genId(), name: val, classes: emptyClasses(checkTargets()), createdAt: Date.now(), completedAt: null });
    saveToStorage(); render();
    toast('已新增進度項目：'+val);
  }
  function saveItemEdit(){
    var id = state.editItemId;
    if(!id){ toast('請選擇要修改的項目'); return; }
    var el = document.getElementById('f-edit-item-name');
    var val = el ? el.value.trim() : '';
    if(!val){ toast('請輸入項目名稱'); return; }
    var item = state.checklist.filter(function(i){ return i.id===id; })[0];
    if(!item) return;
    item.name = val;
    state.editItemId = '';
    saveToStorage(); render();
    toast('已修改項目名稱');
  }
  function addReminderAction(){
    var el = document.getElementById('f-rem-text');
    var text = el ? el.value.trim() : '';
    var dateStr = state.remDate;
    if(!dateStr || !text){ toast('請選擇日期並輸入提醒內容'); return; }
    var monday = mondayOf(dateStr);
    var old = state.reminders[monday];
    state.reminders[monday] = old ? old+'、'+text : text;
    state.remDate = '';
    saveToStorage(); render();
    toast('已加入提醒事項');
  }
  function swapClassesAction(){
    var dateA=state.swapADate, slotA=state.swapASlot;
    var dateB=state.swapBDate, slotB=state.swapBSlot;
    if(!dateA||!slotA||!dateB||!slotB){ toast('請完整選擇兩組日期與時段'); return; }
    if(dateA===dateB && slotA===slotB){ toast('請選擇兩個不同的時段'); return; }
    var wA = weekdayIdxMonFri(dateA), wB = weekdayIdxMonFri(dateB);
    var a = getEffective(dateA, wA, slotA);
    var b = getEffective(dateB, wB, slotB);
    state.overrides[dateA+'__'+slotA] = { content: b.content, type: b.type };
    state.overrides[dateB+'__'+slotB] = { content: a.content, type: a.type };
    state.swapADate=''; state.swapASlot='';
    state.swapBDate=''; state.swapBSlot='';
    saveToStorage(); render();
    toast('已完成調課');
  }
  function changeCourseAction(){
    var el = document.getElementById('f-chg-content');
    var content = el ? el.value.trim() : '';
    var dateStr = state.chgDate, slot = state.chgSlot;
    if(!dateStr||!slot||!content){ toast('請完整輸入日期、時段、異動內容'); return; }
    state.overrides[dateStr+'__'+slot] = { content: content, type: 'change' };
    state.chgDate=''; state.chgSlot='';
    saveToStorage(); render();
    toast('已完成課程異動');
  }
  function deleteCourseAction(){
    var dateStr = state.chgDate, slot = state.chgSlot;
    if(!dateStr||!slot){ toast('請選擇日期與時段'); return; }
    state.overrides[dateStr+'__'+slot] = { content:'', type:'empty' };
    state.chgDate=''; state.chgSlot='';
    saveToStorage(); render();
    toast('已刪除該時段內容');
  }
  function setHolidayAction(){
    var el = document.getElementById('f-hol-name');
    var name = el ? el.value.trim() : '';
    var dateStr = state.holDate;
    if(!dateStr||!name){ toast('請輸入日期與假期名稱'); return; }
    SLOTS.forEach(function(s){
      state.overrides[dateStr+'__'+s] = (s === 'M') ? { content:name, type:'holiday' } : { content:'', type:'holiday-empty' };
    });
    state.holidayNames[dateStr] = name;
    state.holDate = '';
    saveToStorage(); render();
    toast('已設定放假：'+name);
  }

  function currentBackupData(){
    return {
      myTitle: state.myTitle,
      termStart: state.termStart, termEnd: state.termEnd, template: state.template,
      templateOptions: state.templateOptions,
      overrides: state.overrides, holidayNames: state.holidayNames, reminders: state.reminders,
      keyNotes: state.keyNotes, checklist: state.checklist,
      exportedAt: new Date().toISOString()
    };
  }
  function generateExport(){
    var el = document.getElementById('backup-export-text');
    if(el) el.value = JSON.stringify(currentBackupData(), null, 2);
    toast('已產生匯出內容，可複製或下載');
  }
  function copyExport(){
    var el = document.getElementById('backup-export-text');
    if(!el || !el.value){ toast('請先按「產生匯出內容」'); return; }
    el.focus(); el.select();
    try{ el.setSelectionRange(0, 999999); }catch(e){}
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(el.value).then(function(){
        toast('已複製到剪貼簿');
      }).catch(function(){
        try{ document.execCommand('copy'); toast('已複製到剪貼簿'); }
        catch(e2){ toast('複製失敗，請長按文字框手動選取複製'); }
      });
    } else {
      try{ document.execCommand('copy'); toast('已複製到剪貼簿'); }
      catch(e2){ toast('複製失敗，請長按文字框手動選取複製'); }
    }
  }
  function downloadExport(){
    try{
      var text = JSON.stringify(currentBackupData(), null, 2);
      var blob = new Blob([text], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'school-schedule-backup-'+formatDate(new Date())+'.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
      toast('已開始下載備份檔案');
    }catch(e){
      toast('下載失敗，請改用「複製到剪貼簿」');
    }
  }
  function applyImportedData(data){
    if(!data || typeof data !== 'object'){ toast('匯入內容格式不正確'); return false; }
    state.myTitle = data.myTitle || '';
    state.termStart = data.termStart || '';
    state.termEnd = data.termEnd || '';
    state.template = data.template || emptyTemplate();
    state.templateOptions = data.templateOptions || [];
    state.overrides = data.overrides || {};
    state.holidayNames = data.holidayNames || {};
    state.reminders = data.reminders || {};
    state.keyNotes = data.keyNotes || {};
    state.checklist = data.checklist || [];
    state.currentWeekIndex = 0;
    saveToStorage();
    render();
    toast('匯入完成');
    return true;
  }
  function doImport(){
    var fileInput = document.getElementById('backup-import-file');
    if(fileInput && fileInput.files && fileInput.files[0]){
      var reader = new FileReader();
      reader.onload = function(e){
        var data;
        try{ data = JSON.parse(e.target.result); }
        catch(err){ toast('檔案內容不是有效的備份格式'); return; }
        if(!window.confirm('此操作將覆蓋目前所有資料，確定要匯入嗎？')) return;
        applyImportedData(data);
      };
      reader.readAsText(fileInput.files[0]);
      return;
    }
    var textEl = document.getElementById('backup-import-text');
    var raw = textEl ? textEl.value.trim() : '';
    if(!raw){ toast('請貼上備份內容，或選擇備份檔案'); return; }
    var data;
    try{ data = JSON.parse(raw); }
    catch(err){ toast('內容不是有效的JSON格式'); return; }
    if(!window.confirm('此操作將覆蓋目前所有資料，確定要匯入嗎？')) return;
    applyImportedData(data);
  }

  function buildPrintHtml(){
    var weeks = buildWeeks(state.termStart, state.termEnd);
    var html = '<h1>課務行事曆與進度（'+escapeHtml(state.termStart)+' ～ '+escapeHtml(state.termEnd)+'）</h1>';
    weeks.forEach(function(week){
      var firstDate = week.days[0].dateStr, lastDate = week.days[week.days.length-1].dateStr;
      html += '<h2>Week '+week.weekIndex+'（'+firstDate+' ～ '+lastDate+'）</h2>';
      if(state.reminders[week.mondayStr]){
        html += '<p>⭐'+escapeHtml(state.reminders[week.mondayStr])+'</p>';
      }
      html += '<table class="ptable"><tr><th></th>'+week.days.map(function(d){ return '<th>'+WEEKDAY_LABELS[d.weekdayIdx]+' '+d.dateStr.slice(5)+'</th>'; }).join('')+'</tr>';
      SLOTS.forEach(function(slot){
        html += '<tr><td>'+slot+'</td>';
        week.days.forEach(function(d){
          if(!d.inRange){ html += '<td>-</td>'; return; }
          var cell = getEffective(d.dateStr, d.weekdayIdx, slot);
          html += '<td>'+(escapeHtml(cell.content)||'—')+'</td>';
        });
        html += '</tr>';
      });
      html += '</table>';
      if(state.keyNotes[week.mondayStr]){
        html += '<p><strong>重點紀錄：</strong>'+escapeHtml(state.keyNotes[week.mondayStr])+'</p>';
      }
    });

    var targets = checkTargets();
    if(targets.length > 0 && state.checklist.length > 0){
      html += '<h2>進度</h2><table class="ptable"><tr><th>項目</th>'+targets.map(function(t){ return '<th>'+escapeHtml(t)+'</th>'; }).join('')+'</tr>';
      sortedChecklist().forEach(function(item){
        html += '<tr><td>'+escapeHtml(item.name)+'</td>';
        targets.forEach(function(t){
          var cell = item.classes[t] || { status:'empty' };
          var mark = cell.status === 'colored' ? '✓' : (cell.status === 'detail' ? (shortDate(cell.date)||'•') : '');
          html += '<td>'+mark+'</td>';
        });
        html += '</tr>';
      });
      html += '</table>';
    }
    return html;
  }

  function doResetForNewSemester(){
    state.termStart=''; state.termEnd=''; state.template=emptyTemplate(); state.templateOptions=[];
    state.overrides={}; state.holidayNames={}; state.reminders={}; state.keyNotes={};
    state.checklist=[]; state.currentWeekIndex=0; state.endSemOpen=false; state.endsemDate=''; state.endsemPdf='';
    state.sectionOpen.setup = true; state.tab='calendar';
    saveToStorage(); render();
    toast('學期已結束，系統已重新初始化');
  }
  function endSemester(){
    var dateStr = state.endsemDate;
    if(!dateStr){ toast('請輸入日期'); return; }
    if(state.endsemPdf === 'yes'){
      var area = document.getElementById('print-area');
      if(area){
        area.innerHTML = buildPrintHtml();
        window.print();
      }
    }
    doResetForNewSemester();
  }
  function openEditor(itemId, cls){
    var item = state.checklist.filter(function(i){ return i.id===itemId; })[0];
    if(!item) return;
    if(!item.classes[cls]) item.classes[cls] = { status:'empty', date:'', text:'' };
    state.editingCell = { itemId: itemId, cls: cls };
    state.editDate = item.classes[cls].date || '';
    render();
  }
  function closeEditor(){ state.editingCell = null; state.editDate=''; render(); }
  function saveCell(status){
    if(!state.editingCell) return;
    if(!state.editDate){ toast('請選擇日期'); return; }
    var textEl = document.getElementById('editor-text');
    var textVal = textEl ? textEl.value : '';
    var item = state.checklist.filter(function(i){ return i.id===state.editingCell.itemId; })[0];
    if(!item) return;
    item.classes[state.editingCell.cls] = { status: status, date: state.editDate, text: textVal };
    var targets = checkTargets();
    var allColored = targets.length > 0 && targets.every(function(t){ return item.classes[t] && item.classes[t].status === 'colored'; });
    item.completedAt = allColored ? (item.completedAt || Date.now()) : null;
    state.editingCell = null; state.editDate='';
    saveToStorage(); render();
  }
  function clearCell(){
    if(!state.editingCell) return;
    var item = state.checklist.filter(function(i){ return i.id===state.editingCell.itemId; })[0];
    if(!item) return;
    item.classes[state.editingCell.cls] = { status:'empty', date:'', text:'' };
    item.completedAt = null;
    state.editingCell = null; state.editDate='';
    saveToStorage(); render();
  }

  function shiftDatePickerMonth(delta){
    if(!state.datePicker) return;
    var parts = state.datePicker.viewYM.split('-').map(Number);
    var d = new Date(parts[0], parts[1]-1+delta, 1);
    state.datePicker.viewYM = d.getFullYear()+'-'+pad(d.getMonth()+1);
    render();
  }
  function pickDate(dateStr){
    if(!state.datePicker || !dateStr) return;
    var field = state.datePicker.field, mode = state.datePicker.mode;
    if(mode === 'validated'){
      var v = validateSchoolDate(dateStr);
      if(!v.ok){ toast(v.msg); return; }
    }
    state[field] = dateStr;
    state.datePicker = null;
    saveToStorage(); render();
  }
  function clearPickedDate(){
    if(!state.datePicker) return;
    state[state.datePicker.field] = '';
    state.datePicker = null;
    saveToStorage(); render();
  }

  // ---------- Event delegation ----------
  function onRootClick(e){
    var btn = e.target.closest ? e.target.closest('[data-action]') : null;
    if(!btn) return;
    var action = btn.getAttribute('data-action');
    switch(action){
      case 'set-tab': state.tab = btn.getAttribute('data-tab'); render(); break;
      case 'set-template-day': state.templateActiveDay = parseInt(btn.getAttribute('data-day'),10); render(); break;
      case 'prev-week': state.currentWeekIndex = Math.max(0, state.currentWeekIndex-1); render(); break;
      case 'next-week': {
        var weeks = buildWeeks(state.termStart, state.termEnd);
        state.currentWeekIndex = Math.min(weeks.length-1, state.currentWeekIndex+1);
        render(); break;
      }
      case 'add-course': addCourseItem(); break;
      case 'save-item-edit': saveItemEdit(); break;
      case 'add-reminder': addReminderAction(); break;
      case 'swap-classes': swapClassesAction(); break;
      case 'change-course': changeCourseAction(); break;
      case 'delete-course': deleteCourseAction(); break;
      case 'set-holiday': setHolidayAction(); break;
      case 'gen-export': generateExport(); break;
      case 'copy-export': copyExport(); break;
      case 'download-export': downloadExport(); break;
      case 'do-import': doImport(); break;
      case 'toggle-endsem': state.endSemOpen = true; render(); break;
      case 'cancel-endsem': state.endSemOpen = false; render(); break;
      case 'confirm-endsem': endSemester(); break;
      case 'add-tplopt': state.templateOptions.push({ name:'', isTarget:false }); saveToStorage(); render(); break;
      case 'remove-tplopt': {
        var ridx = parseInt(btn.getAttribute('data-idx'),10);
        state.templateOptions.splice(ridx,1);
        saveToStorage(); render(); break;
      }
      case 'toggle-section': {
        var key = btn.getAttribute('data-key');
        state.sectionOpen[key] = !state.sectionOpen[key];
        render(); break;
      }
      case 'open-editor': openEditor(btn.getAttribute('data-item'), btn.getAttribute('data-cls')); break;
      case 'close-editor': closeEditor(); break;
      case 'save-cell': saveCell(btn.getAttribute('data-status')); break;
      case 'clear-cell': clearCell(); break;
      case 'open-datepicker': {
        var field = btn.getAttribute('data-field');
        var mode = btn.getAttribute('data-mode');
        var cur = state[field];
        var base = cur || formatDate(new Date());
        state.datePicker = { field: field, mode: mode, viewYM: base.slice(0,7) };
        render(); break;
      }
      case 'close-datepicker': state.datePicker = null; render(); break;
      case 'dp-prev-month': shiftDatePickerMonth(-1); break;
      case 'dp-next-month': shiftDatePickerMonth(1); break;
      case 'dp-pick': pickDate(btn.getAttribute('data-date')); break;
      case 'dp-clear': clearPickedDate(); break;
      default: break;
    }
  }
  function onDocClick(e){
    var overlay = e.target.closest ? e.target.closest('.modal-overlay') : null;
    if(!overlay || e.target !== overlay) return;
    if(overlay.classList.contains('dp-overlay')){ state.datePicker = null; render(); return; }
    closeEditor();
  }
  function onChange(e){
    var el = e.target;
    if(!el || !el.getAttribute) return;
    var action = el.getAttribute('data-action');
    if(action === 'set-field'){
      state[el.getAttribute('data-field')] = el.value;
      render();
      return;
    }
    if(action === 'set-template-value'){
      state.template[state.templateActiveDay][el.getAttribute('data-slot')] = el.value;
      saveToStorage(); render();
      return;
    }
    if(action === 'toggle-tplopt-target'){
      var idx = parseInt(el.getAttribute('data-idx'),10);
      if(state.templateOptions[idx]){ state.templateOptions[idx].isTarget = el.checked; }
      saveToStorage(); render();
      return;
    }
  }
  function onFocusOut(e){
    var el = e.target;
    if(!el || !el.getAttribute) return;
    var action = el.getAttribute('data-action');
    if(action === 'save-keynotes'){
      var week = el.getAttribute('data-week');
      state.keyNotes[week] = el.value;
      saveToStorage();
      return;
    }
    if(action === 'save-tplopt-name'){
      var idx = parseInt(el.getAttribute('data-idx'),10);
      if(state.templateOptions[idx]){ state.templateOptions[idx].name = el.value.trim(); }
      saveToStorage(); render();
      return;
    }
    if(action === 'save-mytitle'){
      state.myTitle = el.value.trim();
      saveToStorage();
      updateAppTitle();
      return;
    }
  }

  function updateAppTitle(){
    var el = document.getElementById('app-title');
    if(el) el.textContent = state.myTitle ? state.myTitle : '課務行事曆管理';
  }

  function jumpToCurrentWeek(){
    var weeks = buildWeeks(state.termStart, state.termEnd);
    if(weeks.length === 0) return;
    var todayStr = formatDate(new Date());
    for(var i=0;i<weeks.length;i++){
      var w = weeks[i];
      var lastDay = w.days[w.days.length-1].dateStr;
      var firstDay = w.days[0].dateStr;
      if(todayStr >= firstDay && todayStr <= lastDay){ state.currentWeekIndex = i; return; }
    }
    if(todayStr < weeks[0].days[0].dateStr){ state.currentWeekIndex = 0; return; }
    state.currentWeekIndex = weeks.length - 1;
  }

  document.addEventListener('DOMContentLoaded', function(){
    var restored = loadFromStorage();
    if(restored) jumpToCurrentWeek();
    render();
    if(restored) toast('已還原先前儲存的資料');
    document.body.addEventListener('click', onRootClick);
    document.body.addEventListener('click', onDocClick);
    document.body.addEventListener('change', onChange);
    document.body.addEventListener('focusout', onFocusOut);
  });
})();
</script>
</body>
</html>
